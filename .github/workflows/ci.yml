name: CPU integration and web build
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  cpu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -c "from pathlib import Path; Path('results').mkdir(exist_ok=True)"
      - run: python -m pytest tests --basetemp results/ci-tmp --junitxml results/ci-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-results-${{ matrix.os }}
          path: results/ci-tests.xml
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
