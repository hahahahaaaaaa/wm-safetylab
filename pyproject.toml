[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wm-safetylab"
version = "0.3.0"
description = "A small configuration-driven world-model experiment workbench"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.142.1", "uvicorn==0.54.0",
  "httpx==0.28.1", "typer>=0.12,<1", "psutil>=5.9,<8"
]

[project.optional-dependencies]
video = ["imageio-ffmpeg==0.6.0"]
dev = ["pytest>=8,<10"]

[project.scripts]
wms = "wms.app.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
